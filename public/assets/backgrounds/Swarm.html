<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swarm</title>
  <style>


body, html, #app {
  margin: 0;
  width: 100%;
  height: 100%;
}

#app {
  overflow: hidden;
  touch-action: pan-up;
  filter:overlay;
  width:100vw;
  display:flex;
  color: #ffffff;
  font-family: 'Montserrat', sans-serif;
  text-align: center;
  text-shadow: 0 0 5px #000000, 0 0 20px #000;
  user-select: none;
}

#app h1 {
  --fontSize: 50px;
  --lineHeight: 70px;
  width: auto;
  height: calc(2 * var(--lineHeight));
  line-height: var(--lineHeight);
  margin: calc(50vh - var(--lineHeight)) auto 0;
  font-size: var(--fontSize);
}

#app a {
  margin-top: 10px;
  display: inline-block;
  text-decoration: none;
  color: #fff;
}

#app canvas {
  display: block;
  position: fixed;
  z-index: -1;
  top: 0;
}
 
.tornado {
  opacity:.8;
  user-select:none;
  mix-blend-mode:lighten;
  animation:rotate 1005s linear infinite;
  transform-style:preserve-3d;
  position:absolute;
left:10vw;
top:0;
}  
@keyframes rotate {
  0% {
    transform: rotateY(0deg) rotateX(0deg)scale(21);
    }
    100% {
      transform: rotateY(0deg)rotateX(0deg)scale(03);
      }
      }

</style>
<div id="app">
    <img class="tornado" src=("tornado.png")>    
  </div>
</div>

<script type = "module">
import { swarmBackground } from 'https://unpkg.com/threejs-toys@0.0.8/build/threejs-toys.module.cdn.min.js'

const bg = swarmBackground({
  el: document.getElementById('app'),
  eventsEl: document.body,
  gpgpuSize: 256,
    color: [Math.random() * 0xffffff, Math.random() * 0xffffff],
  geometry: 'default'
})

bg.three.camera.position.set(0, 0, 200)

document.body.addEventListener('click', () => {
  bg.setColors([Math.random() * 0x000000, Math.random() * 0xabcdeff])
})
</script>
</body>
</html>
