<!DOCTYPE html>
<html lang="en">
<head>
<style>
  /* Make canvas fill the screen */
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { background: #000; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
/* Initialize scene, camera, renderer */
let scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.03);
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.7,0);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* Create floor (night sky) */
let floorGeo = new THREE.PlaneGeometry(100, 100, 64, 64);
floorGeo.rotateX(-Math.PI/2);
let floorMat = new THREE.MeshPhongMaterial({ color: 0x000000 });
let floor = new THREE.Mesh(floorGeo, floorMat);
floor.receiveShadow = true;
scene.add(floor);

/* Add some 'star' points on floor (small, twinkling effect) */
for (let i = 0; i < 200; i++){
  let starGeo = new THREE.SphereGeometry(0.02, 4, 4);
  let starMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  let star = new THREE.Mesh(starGeo, starMat);
  let x = (Math.random() - 0.5)*90;
  let z = (Math.random() - 0.5)*90;
  star.position.set(x, 0.01, z);
  scene.add(star);
}

/* Fake moving clouds over floor via semi-transparent plane */
let cloudGeo = new THREE.PlaneGeometry(100, 100);
cloudGeo.rotateX(-Math.PI/2);
let cloudCanvas = document.createElement('canvas');
cloudCanvas.width = 512; cloudCanvas.height = 512;
let cloudCtx = cloudCanvas.getContext('2d');
let cloudTexture = new THREE.CanvasTexture(cloudCanvas);
let cloudMat = new THREE.MeshBasicMaterial({ map: cloudTexture, transparent:true, opacity:0.2 });
let cloudPlane = new THREE.Mesh(cloudGeo, cloudMat);
scene.add(cloudPlane);
function drawClouds(t){
  cloudCtx.fillStyle = 'rgba(0,0,0,0.0)';
  cloudCtx.fillRect(0,0,512,512);
  cloudCtx.fillStyle = 'rgba(255,255,255,0.2)';
  for(let i=0;i<40;i++){
    let x = Math.random()*512;
    let y = (Math.random()*512 + t*20) % 512;
    let r = Math.random()*50+20;
    cloudCtx.beginPath();
    cloudCtx.arc(x,y,r,0,2*Math.PI);
    cloudCtx.fill();
  }
  cloudTexture.needsUpdate = true;
}

/* Create ceiling (water-like) */
let ceilingGeo = new THREE.PlaneGeometry(100, 100, 64, 64);
ceilingGeo.rotateX(Math.PI/2);
ceilingGeo.translate(0,10,0);
let ceilingCanvas = document.createElement('canvas');
ceilingCanvas.width = 512; ceilingCanvas.height = 512;
let ceilingCtx = ceilingCanvas.getContext('2d');
for(let i=0;i<512;i++){
  for(let j=0;j<512;j++){
    let blue = 200 + Math.floor(Math.random()*55);
    ceilingCtx.fillStyle = `rgb(${0},${blue},${255})`;
    ceilingCtx.fillRect(i,j,1,1);
}
}
let ceilingTex = new THREE.CanvasTexture(ceilingCanvas);
let ceilingMat = new THREE.MeshPhongMaterial({ map: ceilingTex, side:THREE.DoubleSide });
let ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
scene.add(ceiling);

/* Hexagonal outer boundary walls */
let wallTexture = new THREE.TextureLoader().load('https://threejsfundamentals.org/threejs/resources/images/wall.jpg');
wallTexture.wrapS = wallTexture.wrapT = THREE.RepeatWrapping;
wallTexture.repeat.set(1,2);
let wallMat = new THREE.MeshPhongMaterial({ map: wallTexture });
let hexRadius = 20;
for(let i=0; i<6; i++){
  let angle = i * (Math.PI*2/6);
  let wallGeo = new THREE.BoxGeometry(15, 5, 1);
  let wall = new THREE.Mesh(wallGeo, wallMat);
  wall.position.set(Math.cos(angle)*hexRadius, 2.5, Math.sin(angle)*hexRadius);
  wall.rotation.y = -angle;
  scene.add(wall);
}

/* Build interior maze walls (manually placed for a single-solution path).
   Each is a small Box, carefully arranged. */
let walls = [];
function addWall(x,z,width,depth,rot=0){
  let wg = new THREE.BoxGeometry(width, 5, depth);
  let w = new THREE.Mesh(wg, wallMat.clone());
  w.position.set(x,2.5,z);
  w.rotation.y = rot;
  scene.add(w);
  w.geometry.computeBoundingBox();
  w.updateMatrixWorld();
  walls.push(w);
}
/* Example internal walls (tuned to create a single-solution labyrinth).
   This is not necessarily symmetrical or perfect, but arranged to be challenging. */
addWall(0,  5, 1,  8, 0);
addWall(4,  2, 6,  1, 0);
addWall(-4, 1, 8,  1, 0);
addWall(8,  0, 1,  8, 0);
addWall(-6, 0, 1,  8, 0);
addWall(4, -4,8,   1, 0);
addWall(-4,-4,8,   1, 0);
addWall(0, -7,1,   6, 0);
addWall(6,  -2,1,   6, Math.PI/2);
addWall(-6, 2, 1,   6, Math.PI/2);
addWall(2,  7, 1,   6, Math.PI/2);

/* Torches on walls (use small spheres with pointLights) */
function addTorch(px, py, pz){
  let torchGeo = new THREE.SphereGeometry(0.1, 8, 8);
  let torchMat = new THREE.MeshBasicMaterial({ color:0xffaa00 });
  let torch = new THREE.Mesh(torchGeo, torchMat);
  torch.position.set(px, py, pz);
  scene.add(torch);

  let light = new THREE.PointLight(0xffaa00, 1, 5);
  light.position.set(px, py, pz);
  scene.add(light);
}
/* Place a few torches along the corridors */
addTorch( 0,  2.5,  2);
addTorch( 4,  2.5,  0);
addTorch(-4,  2.5,  0);
addTorch( 0,  2.5, -5);
addTorch( 8,  2.5,  0);
addTorch(-6, 2.5,  0);

/* Basic ambient light to see everything faintly */
let ambientLight = new THREE.AmbientLight(0x333333);
scene.add(ambientLight);

/* Movement controls */
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let lookMode = false;
let speed = 0.05;
document.addEventListener('keydown', (e)=>{
  if(e.code === 'ArrowUp') moveForward = true;
  if(e.code === 'ArrowDown') moveBackward = true;
  if(e.code === 'ArrowLeft') moveLeft = true;
  if(e.code === 'ArrowRight') moveRight = true;
  if(e.key === 's' || e.key === 'S') lookMode = true;
});
document.addEventListener('keyup', (e)=>{
  if(e.code === 'ArrowUp') moveForward = false;
  if(e.code === 'ArrowDown') moveBackward = false;
  if(e.code === 'ArrowLeft') moveLeft = false;
  if(e.code === 'ArrowRight') moveRight = false;
  if(e.key === 's' || e.key === 'S') lookMode = false;
});

/* Collision detection helpers */
function getWallBoxes(){
  return walls.map(w=>{
    let box = new THREE.Box3().setFromObject(w);
    return box;
  });
}

/* Animation loop */
let clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  let delta = clock.getDelta();
  let t = clock.getElapsedTime();
  drawClouds(t);

  /* Move or look logic */
  let dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  let right = new THREE.Vector3();
  right.crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
  let oldPos = camera.position.clone();
  let rotSpeed = 1.5;

  if(!lookMode){
    if(moveForward) camera.position.addScaledVector(dir, speed);
    if(moveBackward) camera.position.addScaledVector(dir, -speed);
    if(moveLeft) camera.position.addScaledVector(right, -speed);
    if(moveRight) camera.position.addScaledVector(right, speed);
  } else {
    if(moveLeft) camera.rotation.y += rotSpeed*delta;
    if(moveRight) camera.rotation.y -= rotSpeed*delta;
    if(moveForward) camera.rotation.x -= rotSpeed*delta*0.5;
    if(moveBackward) camera.rotation.x += rotSpeed*delta*0.5;
  }

  /* Collision check */
  let camBox = new THREE.Box3(
    new THREE.Vector3(camera.position.x-0.2, camera.position.y-1.7, camera.position.z-0.2),
    new THREE.Vector3(camera.position.x+0.2, camera.position.y+0.5, camera.position.z+0.2)
  );
  let boxes = getWallBoxes();
  for(let b of boxes){
    if(camBox.intersectsBox(b)){
      camera.position.copy(oldPos);
      break;
    }
  }

  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
