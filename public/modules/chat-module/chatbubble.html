
<!DOCTYPE html>
<html lang="en" >

<head>
  <meta charset="UTF-8">
  
<style>
* {transition: all .2s ease-out;
box-sizing: border-box;}
:root {
  --r: 20px;
  --c: #ffffff;
  --light-reflect: inset -5px 20px 2px -20px #fff, inset 5px -20px 2px -20px #fff;
  --hh: 8rem;
}

body {
  display: flex;
  padding: 0 2rem;
  color: var(--c);
  font-family: sans-serif;
  align-items: center;
  justify-content: center;
  min-height: 100svh;
  animation:huerotate 41s linear infinite;
background:    linear-gradient(20deg, white,darkgray,pink,skyblue,gray, gold)
}

@keyframes huerotate {
  0% {
    filter: hue-rotate(0deg);
  }
  100% {
    filter: hue-rotate(360deg);
  }
}

.form {
  position: relative;
  --gap: .5rem;
  max-width: 50rem;
  flex: 1 1 auto;
  height: var(--hh);
  font-family:"Xiomara", cursive !important;

}
.form.open {
  height: calc(var(--hh) * 1.5 + var(--gap));
}

button {
  appearance: none;
  border: none;
  background: none;
}

input {
  appearance: none;
  border: none;
  background: none;
  width: 100%;
  height: 2rem;
  color: var(--c);
  height:40px !important;
}
input:focus {
  outline: none;
}


#heading {border: .5px solid palegoldenrod !important;  font-family:Xiomara !important;font-size:24px;   border-radius: 20px !important;;
}
#input > input[type=text], #input.glass {background:linear-gradient(120deg, rgba(135, 207, 235, 0.07),rgba(0, 255, 0, 0.09));backdrop-filter:saturate(20) blur(10px);
  font-family:"Moubaru", sans-serif !important;}

input::placeholder {
  opacity: 0.6;
  color:white;
  text-shadow:1px 1px 2.2px deeppink;
}

@keyframes text {
  0% {
    clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
  }
  100% {
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }
}
.form-title {
  clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
  animation: text linear 2s forwards;
  text-align:center;
}
.form-title span {
  animation: text2 linear 3.5s forwards;
}
@keyframes text2 {
  0%,80% {color:transparent;clip-path: polygon(0 0, 0 0, 0 0%, 0 0%)}
  90%{  color:blue;  clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
  }
  100% {
color:white;    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);letter-spacing:0;
  }
}


@keyframes gradient {
  0% {
    background-size: 100%;
  }
  50% {
    background-size: 150%;
  }
  100% {
    background-size: 100%;
  }
}
.glass {
  position: relative;
  display: flex;
  align-items: center;
  min-height: 4rem;
  border-radius: var(--r);
  border: none;
  width: 100%;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(2px);
  text-shadow: 0.25em 0.25em 1px #00000010;
  --shadow-color: 0deg 0% 64%;
  --shadow-elevation-high:
    0.5px 1px 1.1px hsl(var(--shadow-color) / 0.28),
    1.4px 3.1px 3.4px -0.4px hsl(var(--shadow-color) / 0.27),
    2.5px 5.3px 5.9px -0.7px hsl(var(--shadow-color) / 0.25),
    3.9px 8.4px 9.3px -1.1px hsl(var(--shadow-color) / 0.24),
    6px 12.9px 14.3px -1.5px hsl(var(--shadow-color) / 0.23),
    9px 19.5px 21.6px -1.8px hsl(var(--shadow-color) / 0.21),
    13.4px 28.9px 32px -2.2px hsl(var(--shadow-color) / 0.2),
    19.3px 41.7px 46.2px -2.6px hsl(var(--shadow-color) / 0.19),
    27.1px 58.5px 64.8px -2.9px hsl(var(--shadow-color) / 0.17),
    37.1px 80px 88.6px -3.3px hsl(var(--shadow-color) / 0.16);
  --inner-light: inset 0 -6px 2px -5px #ffffff24, inset 0 -8px 3px -5px #ffffff3b, inset 0 -20px 10px -15px #ffffff5c, inset 7px 25px 10px -20px #ffffff5c;
  --inner-shadow: inset -20px 5px 10px -20px #00000021, inset -40px 50px 7px -55px #00000021;
  --external-light: 5px -30px 30px -20px #ffffff70, 5px 10px 30px -20px #ffffff70;
  --default: var(--external-light), var(--shadow-elevation-high), var(--inner-light), var(--inner-shadow);
  box-shadow: var(--default);
}
.glass:focus {
  outline: none;
}
.glass--gradient {
  background-position: center;
  animation: gradient 10s linear infinite;
  background: linear-gradient(45deg, #85d5e757, #7a9ed254, #ba6ac93d, #de54c217, #f86b2d4f);
}
.glass--heading {
  font-size: 1.1rem;
}
.glass--heading:before {
  --i: 2px;
  opacity: 0.6;
}
.glass--heading:after {
  --i: 4px;
}
.glass--heading:before, .glass--heading:after {
  content: "";
  pointer-events: none;
  position: absolute;
  inset: var(--i);
  border-radius: calc(var(--r) - var(--i));
  box-shadow: var(--light-reflect), var(--shadow-reflect);
}
.glass > * {
  position: relative;
  z-index: 1;
}
.glass:before {
  --r: 20px;
  --bp: 50px;
  --s: calc(0% + var(--bp) + var(--r));
  --e: calc(100% - var(--bp) - var(--r));
  --z: calc(0% + var(--bp));
  --h: calc(100% - var(--bp));
  content: "";
  position: absolute;
}

.form-header {
  height: var(--hh);
  padding: 0 2rem;
  display: flex;
  align-items: center;
  gap: 2rem;
}

@keyframes icon {
  0% {
    rotate: 0deg;
    scale: 0.8;
    filter: hue-rotate(0deg);
  }
  50% {
    rotate: 180deg;
    scale: 1.2;
    filter: hue-rotate(90deg);
  }
  100% {
    rotate: 360deg;
    scale: 0.8;
    filter: hue-rotate(0deg);
  }
}
.form-icon {
  position: relative;
  background: rgba(255, 255, 255, 0.2);
  display: block;
  aspect-ratio: 1;
  flex: 0 0;
  border-radius: 50px;
  height: 4rem;
  box-shadow: var(--light-reflect), var(--shadow-reflect);
}
.form-icon:before {
  animation: icon 5000ms cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
  content: "";
  position: absolute;
  inset: 0;
  border-radius:1000px; overflow:hidden;
background:radial-gradient(circle at bottom right, yellow, pink, turquoise, white);}

.form-close-button {
  position: absolute;
  color: var(--c);
  background: rgba(255, 255, 255, 0.3);
  top: 0.75rem;
  right: 0.75rem;
  box-shadow: var(--light-reflect), var(--shadow-reflect);
  display: grid;
  place-content: center;
  height: 1.5rem;
  width: 1.5rem;
  border-radius: 50px;
  cursor: pointer;
  visibility: hidden;
  opacity: 0;
}
.open .form-close-button {
  visibility: visible;
  opacity: 1;
}

[id=heading] {
  cursor: pointer;
}
.form:not(.open) [id=heading]:hover {
  scale: 1.1;
  filter: brightness(1.15);
}
.form:not(.open) [id=heading]:active {
  scale: 0.98;
  filter: brightness(0.8);
}

[id=input] {
  position: absolute;
  top: 0;
  left: 0;
  z-index: -1;
  height: var(--hh);
  translate: 0 0;
  opacity: 0;
}
.open [id=input], .open [id=input] .input.glass {
  translate: 0 calc(var(--hh) + var(--gap));
  opacity: 1;
  z-index: 2;
overflow:hidden;    background: linear-gradient(120deg, rgba(135, 207, 235, 0.3), rgba(0, 255, 0, 0.3));
    font-family: "Moubaru", sans-serif !important;
    padding: 0 !important;
    height: 28px !important;
    padding: 0 !important;
    margin: 0 !important;
    min-height: 0px !important;
    text-align: center;
    padding-left: 15px !important;
}

</style>

  <script>
  window.console = window.console || function(t) {};
</script>

  <script src="https://public.codepenassets.com/js/prefixfree-1.0.7.min.js"></script>

  
</head>

<body translate="no">
  <div id="form" class="form">
  <div id="heading" class="glass glass--gradient glass--heading">
    
    <span class="form-header">
      <span class="form-icon"></span><span class="form-title">Love yourself, love your life. <br> <span class="right">––Brockdock </span> </span>
    <button class="form-close-button">✕</button>
  </div>
  <div id="input" class="glass">
    <input type="text" placeholder="Type your request here">
  </div>
</div>
  
    <script id="rendered-js" >
const form = document.getElementById("form");
const heading = document.getElementById("heading");
heading.onclick = e => {
  form.classList.toggle('open');
};

  </script>

  
</body>

</html>
