<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   404 Page Not Found
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Thin&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
      font-family: 'Jost Thin', sans-serif;
      background:black;
      justify-items:center;
    }
    
@keyframes hot {
  0%{opacity:0;text-shadow:0 0 1px transparent; color:black;}
  50% {opacity:1;color:black;}
  100% {opacity:1; text-shadow: 0 0 14px white}
}

#orb{animation:hueroto 10s linear infinite}
@keyframes hueroto {
  0% {filter:hue-rotate(0deg)saturate(.85);opacity:0}
  5% {filter:hue-rotate(42deg)saturate(.4)brightness(3);opacity:1;}
  50% {opacity:1;} 
  100% {filter:hue-rotate(360deg)saturate(.85);opacity:0}
}

@keyframes hueroto2 {  
  0% {filter:hue-rotate(0deg)saturate(.85);opacity:1;transform:scale(.1)translate(-50%,-50%)rotate(-10000deg)}
  10% {filter:hue-rotate(360deg)saturate(.85);opacity:1;transform:translate(-50%, -50%)scale(1)rotate(-400deg);}

  100% {filter:hue-rotate(0deg)saturate(5);opacity:.5;transform:translate(-50%, -50%)scale(0)rotate(1080deg)}
}
    .PNF {
      position:absolute;
      top:0;
      left:0;
      font-size:128px;
      color:yellow;
    }
    #starpng {
animation:hueroto2 20s cubic-bezier(0.0175, 0.285, 0.22,4) forwards;
      position:absolute;
      top:50%;
      left:60%;
      transform:scale(1)translate(-50%, -50%);
    }

    #four {
      position:absolute;
      top:50%;
      animation:hot 10s linear forwards;
      left:60%;
      transform:translate(-50%, -50%);
      color:white;
      font-size:33rem;
    }
    img {
      object-fit: cover;
      position:absolute;
      transform:scale(2);
      height:100vh;
      width:100vw;
animation:hueroto 20s linear forwards;

    }
  </style>
 </head>
<body>
 <img  src="404bg.jpg" width="1920"/>
    <div class="PNF">
     PAGE
    <br>
     NOT
    <br>
     FOUND
    </div>
    <div id="four">
     404
    </div>
     <img src = "star.png" id="starpng">
    </div>
   </div>
  </div>
 </body>
</html>
