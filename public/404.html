<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   404 Page Not Found
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Thin&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
      font-family: 'Jost Thin', sans-serif;
      background:black;
      background-image:url('https://i.ibb.co/yBnsMsGv/briizbg6.png');
      justify-items:center;
      animation:hueroto 10s linear forwards
    }
    
@keyframes hot {
  0%,10%{opacity:0;text-shadow:0 0 1px transparent; color:transparent;line-height:200px;}
  5%,15% {opacity:1;color:black;}
  100% {opacity:1; text-shadow: 0 0 14px white;line-height:40px;
  }
}

@keyframes hueroto {
  0% {backdrop-filter:hue-rotate(0deg)saturate(.85)brightness(0);background-position:0% 0%;}
  5% {backdrop-filter:hue-rotate(42deg)saturate(.4)brightness(0);opacity:1;}
  50% {opacity:1;backdrop-filter:hue-rotate(152deg)saturate(2)brightness(0);; }
  100% {backdrop-filter:hue-rotate(360deg)saturate(.85)brightness(.6);;background-position:100% 100%;}
}

@keyframes hueroto2 {  
  0% {filter:hue-rotate(0deg)saturate(0);opacity:1;transform:scale(.01)translate(-50%,-50%)rotate(-10000deg)}
  10% {filter:hue-rotate(360deg)saturate(.15);opacity:1;transform:translate(-50%, -50%)scale(2)rotate(-400deg);}

  100% {filter:hue-rotate(0deg)saturate(.5);opacity:1;transform:translate(-50%, -50%)scale(0)rotate(1080deg)}
}
    .PNF {
      position:absolute;
      top:0;
      left:0;
      opacity: 0;

      text-align:center;
      width:100%;
      font-size:128px;
      color:yellow;
      animation:hot 4s linear forwards;
      animation-delay:9s;
    }
    #starpng {
animation:hueroto2 6s cubic-bezier(0.0175, .001, 0.22,4) forwards;
      position:absolute;
      image-rendering:optimizeQuality;
      top:50%;
      left:60%;
      mix-blend-mode:color-dodge;;
      animation-delay:7s;
      transform:scale(.001)translate(-50%, -50%);
    }

    #four {
      position:absolute;
      top:50%;
      animation:hot 10s linear forwards;
      left:60%;
      transform:translate(-50%, -50%);
      color:white;
      font-size:33rem;
      animation:ltrs 13s cubic-bezier(.0001, .01, 0.22,4) forwards;
    }
    @keyframes ltrs {
      50% {letter-spacing:-33vw; transform:translate(-50%, -50%)rotate(-200deg);}
    }
    
#pic{
      object-fit:cover;
      mix-blend-mode:multiply;
    }
  </style>
 </head>
<body>
    <div class="PNF">
      <br>
      PAGE
      <br>
<br>

      NOT
<br>

      <br>
      FOUND
    </div>
    <div id="four">
     404
    </div>
     <img src = "/assets/img/star.png" id="starpng">
    </div>
   </div>
  </div>
 </body>
</html>
