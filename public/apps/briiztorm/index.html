<style>
  *{background-size:cover;}
  :root {
  --bg: #050607;
  --bg-2: #090b0c;
  --panel: #0b1013;
  --panel-2: #0f151a;
  --text: #cfe7e5;
  --muted: #7d9a98;
  --accent: #57ffd9;
  --accent-2: #88f3ff;
  --accent-warm: #ff7b7b;
  --shadow-1: 0 10px 40px rgba(0,0,0,.6);
  --ring: 0 0 25px rgba(87,255,217,.25), 0 0 65px rgba(255,123,123,.12);
  --glass: rgba(9,12,14,.6);
  --border: 1px solid rgba(150,220,210,.12);
  --greenish: #39ffb3;
}
* { box-sizing: border-box; }
html, body, #app { height: 100%; }
body {
  margin: 0;
  perspective:1600px;
  overflow: hidden;
  color: var(--text);
  font-family: Chillax, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

/* Rail */
.rail {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 76px;
  padding: 12px 10px;
  background: linear-gradient(180deg, rgba(12,14,16,.9), rgba(8,9,10,.85));
  border-right: 1px solid rgba(116,193,180,.1);
  z-index: 5;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 16px;
  box-shadow: 4px 0 40px rgba(0,0,0,.5);
}
.rail-top, .rail-bottom { display: grid; gap: 10px; }
.rail-btn {
  height: 52px; width: 52px;
  display: grid; place-items: center;
  color: #93b6b1;
  background: rgba(20,24,26,.6);
  border: var(--border);
  border-radius: 14px;
  cursor: pointer;
  transition: all .25s ease;
  box-shadow: inset 0 0 0 0 rgba(87,255,217,.2);
}
.rail-btn:hover { color: white; transform: translateY(-1px); box-shadow: inset 0 0 0 1px rgba(87,255,217,.25), var(--shadow-1); }
.rail-btn.active { color: white; background: linear-gradient(180deg, rgba(16,22,24,.75), rgba(8,10,11,.7)); box-shadow: 0 0 15px rgba(87,255,217,.15), inset 0 0 0 1px rgba(87,255,217,.35); }
.rail-btn svg { height: 26px; width: 26px; }
.rail-label { position: relative; writing-mode:sideways-lr; text-orientation: mixed; align-self: center; justify-self: center; color: #b7d8ff; font-weight: 600; letter-spacing: .15em; font-size: 18px; text-shadow: 0 0 15px rgba(80,160,255,.35); opacity: .9; }
.rail-label .rail-glow { position: absolute; left: -6px; right: -6px; top: -8px; bottom: -8px; border-radius: 16px; filter: blur(12px); background: radial-gradient(closest-side, rgba(119,187,255,.25), transparent); z-index: -1; }

/* Workspace grid */
.workspace {
  margin-left: 76px;
  min-height: 100dvh;
  position: relative; /* needed for floating preview + canvas */
  display: grid;
  grid-template-rows: 160px minmax(0, 1fr);
  animation:fadein 5s ease;
  /* Pass through clicks to the cockpit (Zolar iframe) where there are no panes */
  pointer-events: none;
}
@keyframes fadein {
  from { opacity: 0; }
  to { opacity: 1; }
}
/* Panes */
.panes {
  display: grid;
  /* chat far right; middle is open canvas area; explorer left variable width */
  --explorer-w: 320px;
  --chat-w: 420px;
  grid-template-columns: var(--explorer-w) minmax(0,1fr) var(--chat-w);
  transition: grid-template-columns .25s ease;
  min-height: 0;
}
.pane {
  border-top:1px solid rgba(116,193,180,.8);
  border-radius:40px 40px 0 0;
  border-right: 1px solid rgba(116,193,180,.1);
  background: linear-gradient(180deg, rgba(10,12,13,.65), rgba(6,7,8,.75));
  min-height: 0;
    box-shadow:0 -10px 30px black, inset 0 8px 100px darkslategray;
    bottom:0;
    height:40vh;
position:absolute;
  /* Keep UI interactive over cockpit */
  pointer-events: auto;
}
#pane-explorer, #explorer {z-index:1;   border-radius:40px 40px 0 0;left:55px;width:30vw !important;bottom:0;background:rgba(0,0,0,0.45);height:95vh !important;;
}
.pane.preview { border-right: none; border-left: 1px solid rgba(116,193,180,.1);   border-radius:40px 40px 0 0;
}
.explorer-top, .preview-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  border-bottom: var(--border);
    border-radius:40px 40px 0 0;

  backdrop-filter: blur(6px);
}
.tabs { display: inline-flex; gap: 6px; }
.tab {
  padding: 8px 12px; border-radius: 10px; border: var(--border);
  background: rgba(20,24,26,.6); color: var(--muted); cursor: pointer;
  transition: all .2s;
}
.tab.active { color: white; box-shadow: 0 0 24px rgba(87,255,217,.2) inset, 0 0 12px rgba(87,255,217,.08); }
.explorer-actions button, .preview-actions button {
  margin-left: 8px;width:40px; padding: 8px 10px; border-radius: 10px; border: var(--border); color: #cfe; background: rgba(20,24,26,.6); cursor: pointer;
}

.explorer-actions {
    display:flex;
    width: 100px;
    overflow:hidden;
height:80px;    align-items:center;
    flex-wrap:wrap;
}
.preview-actions button.primary, .controls .primary {
  background: linear-gradient(180deg, rgba(17,34,32,.8), rgba(12,20,19,.9));
  border: 1px solid rgba(80,240,210,.5);
  color: #aafff3;
  box-shadow: 0 0 14px rgba(87,255,217,.2), 0 0 45px rgba(87,255,217,.1);
}
/* Re-map columns: explorer left, chat right; preview floats (see below) */
.pane.explorer { grid-column: 1; }
.pane.chat { grid-column: 3; }

/* Explorer collapse/reduce visuals */
.panes.explorer-reduced { --explorer-w: 220px; }
.panes.explorer-hidden { --explorer-w: 0px; }
.panes.explorer-hidden .pane.explorer { pointer-events: none; opacity: 0; transform: translateX(-100%); }
.pane.explorer { transition: opacity .25s ease, transform .25s ease; }
.search { padding: 10px 14px; }
.search input, .composer textarea, .input-wrap input, #explorer-search {
  width: 100%; padding: 10px 12px; border-radius: 12px; border: var(--border);
  background: rgba(14,18,20,.75); color: var(--text);
}
.tree { padding: 8px 6px 80px; overflow: auto; height: calc(100% - 130px); }
.tree .node { padding: 6px 8px; margin: 2px 6px; border-radius: 10px; cursor: pointer; color: #cfe; display: flex; align-items: center; gap: 8px; }
.tree .node:hover { background: rgba(24,32,33,.7); }
.tree .children { margin-left: 18px; }
.node .caret { color: #8fe; font-weight: 700; width: 14px; text-align: center; opacity: .9; }
.node.file .caret { visibility: hidden; width: 14px; }
.node .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node.active { background: rgba(26,42,40,.9); box-shadow: inset 0 0 0 1px rgba(87,255,217,.25); }
.explorer-status { padding: 10px 14px; color: var(--muted); border-top: var(--border); background: rgba(12,14,15,.6); position: sticky; bottom: 0; }

/* Chat */
.pane.chat { display: grid; grid-template-rows: minmax(0,1fr) auto; right:0;}
.messages { overflow: auto; padding: 16px; display: grid; gap: 14px; align-content: start; }
.msg {
  width: fit-content; max-width: min(800px, 92%);
  background: radial-gradient(180% 180% at 20% 0%, rgba(92,250,210,.06), rgba(9,12,14,.9)),
              linear-gradient(180deg, rgba(12,18,18,.85), rgba(7,8,8,.9));
  border: 1px solid rgba(80,220,200,.18);
  color: #cffff3; border-radius: 14px; padding: 14px 16px; box-shadow: var(--ring);
  backdrop-filter: blur(4px);
}
.msg.you { margin-left: auto; background: linear-gradient(180deg, rgba(32,48,56,.7), rgba(15,18,22,.9)); color: #d9e9ff; border-color: rgba(136,196,255,.22); }
.msg .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.msg .tools { margin-top: 8px; font-size: 12px; color: #9ff; opacity: .8; }
.msg .toolchip { display: inline-flex; gap: 6px; align-items: center; background: rgba(18,30,31,.75); padding: 4px 8px; border-radius: 9px; border: 1px solid rgba(120,220,220,.2); margin-right: 6px; }
.msg .tokens { opacity: .7; font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

.composer { padding: 10px 14px 16px; background: linear-gradient(180deg, rgba(6,7,8,.3), rgba(6,7,8,.7)); border-top: var(--border); backdrop-filter: blur(5px); position: sticky; bottom: 0; }
.slash-hint { color: #9ab; font-size: 12px; margin: 0 0 6px 6px; opacity: .8; }
.input-wrap { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.input-wrap textarea {
  resize: none; min-height: 46px; max-height: 42vh; line-height: 1.35; font-size: 15px;
  font-family: Chillax, system-ui, sans-serif;
}
.controls { display: inline-flex; gap: 8px; }
.controls button {
  border-radius: 12px; border: var(--border); padding: 10px 12px; color: #d9fff5; background: rgba(20,24,26,.7); cursor: pointer;
}
.controls button:hover { box-shadow: 0 0 16px rgba(87,255,217,.25) inset; }

/* Preview */
.viewer { height: calc(100% - 52px); overflow: auto; padding: 12px 14px; }
.viewer .empty { color: #8aa; padding: 20px; border: 1px dashed rgba(120,180,170,.35); border-radius: 12px; text-align: center; background: rgba(14,18,20,.4); }
.viewer .md { line-height: 1.6; }
.viewer .md h1, .viewer .md h2 { color: #eaf; }
.viewer pre {
  background: #0c1316; color: #cfe; padding: 12px; border-radius: 10px; overflow: auto; border: 1px solid rgba(100,200,190,.2)
}
.viewer img { max-width: 100%; border-radius: 10px; border: 1px solid rgba(120,200,190,.18); display: block; }

/* Responsive */
@media (max-width: 1400px) {
  .panes { grid-template-columns: 280px minmax(0,1fr) 360px; }
}
@media (max-width: 1100px) {
  .panes { grid-template-columns: var(--explorer-w, 240px) minmax(0,1fr); }
  /* chat overlays on small screens */
  .pane.chat { grid-column: 2; }
}
@media (max-width: 880px) {
  .rail { width: 64px; }
  .workspace { margin-left: 64px; }
  .panes { grid-template-columns: 1fr; }
  .pane.explorer { display: none; }
  .pane.preview { display: none; }
}

/* Body gradient + neon frame without affecting layout */
body {height:100%;
  background: none !important;
  color: #f0f0f0 !important;backdrop-filter:brightness(.8)contrast(1.5);
  font-family: Jost, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
}
body::before {
  content: "";
  position: fixed;
  pointer-events: none;
  z-index: 9999;
}
/* Rail */
.rail {
  background: linear-gradient(to bottom, rgba(0, 128, 128, 0.35), rgba(0,0,0,0) 18%, rgba(0,0,0,0.6)),
              linear-gradient(to right, rgba(32,95,70,.25), rgba(0,255,0,0.02));
  border-right: 1px solid rgba(0,255,155,.35) !important;
  box-shadow: 4px 0 24px rgba(0,0,0,.5), inset 0 0 30px rgba(0, 128, 128, .12);
}
.rail-label span { font-family: 'Bungee Hairline', Jost, sans-serif; letter-spacing: .25em; color: #00ff9b; -webkit-text-stroke: 1px rgba(0, 76, 255, 0.3); text-shadow: 0 0 10px #00ff9b, 0 0 20px #082e50; }
.rail-btn {
  color: skyblue;
  background: linear-gradient(to bottom, rgba(0, 128, 128, 0.5), rgba(0,0,0,0) 36%, rgba(0,0,0,0.4));
  border: 1px solid skyblue;
  box-shadow: 0 0 4px rgba(135, 207, 235, 0.213), 0 0 4px rgba(135, 207, 235, 0.213) inset;
}
.rail-btn:hover { color: skyblue; background: rgba(0, 0, 255, .25); }
.rail-btn.active { box-shadow: 0 0 10px #00ff9b inset, 0 0 12px rgba(0,255,155,.2); color: #00ff9b; }

/* Pane chrome */
.pane {
  background: linear-gradient(to bottom, rgba(0, 128, 128, 0.4), rgba(0,0,0,0) 18%, rgba(0,0,0,.6));
  border-right: 1px solid rgba(0,255,155,.25);
}
.pane.preview { border-left: 1px solid rgba(0,255,155,.25); }
.explorer-top, .preview-top {
  border-bottom: 1px solid rgba(0,255,155,.35) !important;
  background:linear-gradient(120deg,black, rgba(0, 77, 42, 0.27), black, rgba(0, 177, 112, 0.57), black);
}

/* Tabs and buttons */
.tab, .explorer-actions button, .preview-actions button, .controls button {
  font-family: 'Bungee Hairline', Jost, sans-serif;
  background: linear-gradient(to bottom, rgba(0, 128, 128, 0.45), rgba(0,0,0,0) 36%, rgba(0,0,0,.55));
  color: #00ff9b;
  border: 1px solid skyblue;
  box-shadow: 0 0 4px rgba(135, 207, 235, 0.213), 0 0 4px rgba(135, 207, 235, 0.213) inset;
}
.tab.active, .controls .primary, .preview-actions .primary {
  background: linear-gradient(to bottom, skyblue, #000 46%, #000) !important;
  color: rgb(58, 158, 113) !important;
  border: 1px solid skyblue !important;
  box-shadow: 0 0 8px  #00ff9b, 0 0 4px  #00ff9b inset !important;
}
.tab:hover, .explorer-actions button:hover, .preview-actions button:hover, .controls button:hover {
  border-color: #00ff9b;
  box-shadow: 0 0 8px  #00ff9b, 0 0 4px  #00ff9b inset;
  cursor: pointer;
}

/* Inputs */
.search input, .composer textarea, .input-wrap input, #explorer-search {
  background: linear-gradient(to bottom, rgba(0, 128, 128, 0.589), #000 36%, #000);
  border: 1px solid skyblue;
  color: #00ff9b;
  box-shadow: 0 0 4px rgba(135, 207, 235, 0.213), 0 0 4px rgba(135, 207, 235, 0.213) inset;
}
.search input::placeholder, .composer textarea::placeholder, .input-wrap input::placeholder, #explorer-search::placeholder {
  color: rgba(43, 139, 148, 0.916);
  -webkit-text-stroke: 1px rgba(135, 207, 235, 0.3633);
}
.composer textarea:focus, .input-wrap input:focus, #explorer-search:focus {
  outline: none;
  border-color: #00ff9b;
  box-shadow: 0 0 8px  #00ff9b, 0 0 4px  #00ff9b inset;
}

/* Tree items */
.tree .node {
  color: #cfe;
  background: linear-gradient(to right, rgba(0,128,128,.35), rgba(0,0,0,0) 65%);
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.12);
}
.tree .node:hover { background: linear-gradient(120deg, #00ff9987, rgba(0, 98, 78, 0.56), transparent 65%); border-color: rgba(0,255,0,.3); }
.tree .node.active { box-shadow: 0 0 8px rgba(0,255,155,.35) inset; }

/* Chat messages container subtle glass */
.messages { background: linear-gradient(to bottom, rgba(0,0,0,.2), rgba(0,0,0,.4)); }
.msg.assistant .meta, .msg.you .meta { color: skyblue; }

/* Viewer tweaks */
.viewer pre, .viewer img { border: 1px solid rgba(0,255,155,.25) !important; }

/* Floating preview panel (draggable) */
#preview.preview-floating {
  position: absolute;border-radius: 40px 40px 20px 20px ;
  
  z-index: 4; /* above canvas, below rail/frame */
  left: var(--prev-left, 50%);
  top: var(--prev-top, 22vh);
  width: var(--prev-w, min(60vw, 900px));
  height: var(--prev-h, 30vh);
  transform: translate(-50%, 0);
  background: linear-gradient(to bottom, rgba(0, 128, 128, 0.35), rgba(0,0,0,0.45));
  border: 1px solid rgba(0,255,155,.35);
  backdrop-filter: blur(6px);
  box-shadow: 0 10px 40px rgba(0,0,0,.45), inset 0 0 18px rgba(0,255,155,.12);
}
#preview.preview-floating .preview-top {   background:linear-gradient(to right, black, rgba(0, 177, 112, 0.57), black, rgba(0, 177, 112, 0.57), black);border-radius:40px 40px 0 0;font-family:Bungee Hairline;font-size:30px;padding-left:30px;
cursor: grab; border-bottom: 1px dashed rgba(0,255,155,.25) !important; }
#preview.preview-floating .viewer { height: calc(100% - 52px); }
#preview.preview-floating.dragging .preview-top { cursor: grabbing; }
#preview.preview-floating.dragging {filter:hue-rotate(90deg);}

/* Canvas behind panes */
#universe-canvas {
  position: absolute;
  z-index: -100;
  inset: 160px 0 0 0; /* below header area */
  width: 100%;
  height: calc(100% - 160px);
  display: block;
  filter: saturate(1.1) brightness(.85);
}

#btn-edit, #btn-save {
  width:100px;
}
 #zolar-panel {
  position:absolute;
  z-index: 100;
  mix-blend-mode:hue;
  transform-style:preserve-3d;
top:0;left:80px;
  opacity:1;
  width: calc(100% - 80px);
  height: 100vh;
  overflow:hidden;
  border-radius:80px;
  box-shadow:40 30 30px yellow;
  background:linear-gradient(to bottom right, rgba(0,0,0,.2), rgb(61, 0, 23), rgba(0,0,0,.3), rgb(18, 0, 50), transparent),linear-gradient(to top right, transparent, rgb(161, 0, 23), transparent, rgb(18, 0, 150), transparent);
animation: zolarflare 4s linear 1 forwards;
filter:brightness(.8)contrast(1.1)saturate(.6);
}
@keyframes zolarflare {
  0% {filter:hue-rotate(200deg);opacity:0;}
  100%{opacity:1;}
}

</style>

<script>


/* Brainstorm front-end — fake-wired UI
   Author: your pal AI
*/

const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const messagesEl = $('#messages');
const inputEl = $('#composer-input');
const sendBtn = $('#btn-send');
const expandBtn = $('#btn-expand');
const treeEl = $('#file-tree');
const searchEl = $('#explorer-search');
const statusEl = $('#explorer-status');
const importBtn = $('#btn-import');
const importInput = $('#import-input');
const newProjectBtn = $('#btn-new-project');
const tabs = $$('.tab');
const viewer = $('#viewer');
const crumbs = $('#preview-crumbs');
const editBtn = $('#btn-edit');
const saveBtn = $('#btn-save');

// -------------------- Mock data --------------------
const initialData = {
  local: {
    type: 'folder',
    name: 'Projects',
    children: [
      {
        type: 'folder',
        name: 'nebula-app',
        children: [
          { type: 'file', name: 'README.md', content: '# Nebula App\n\nA cosmic Electron playground.\n\n- Start: `npm start`\n- Build: `npm run build`' },
          { type: 'file', name: 'index.html', content: '<!doctype html>\n<html><body><h1>Hi Nebula</h1></body></html>' },
          { type: 'file', name: 'logo.png', contentType: 'image', src: 'https://picsum.photos/seed/nebula/800/450' },
          { type: 'folder', name: 'src', children: [
            { type: 'file', name: 'main.js', content: 'console.log("Hello Nebula")' },
            { type: 'file', name: 'styles.css', content: 'body{background:#000;color:#0ff}' }
          ]}
        ]
      },
      { type: 'folder', name: 'music-mixer', children: [
        { type: 'file', name: 'notes.txt', content: 'Mix ideas:\n- Pad @ 90bpm\n- Add sidechain\n- Riser at bar 33' }
      ]}
    ]
  },
  cloud: {
    type: 'folder', name: 'Cloud',
    children: [
      { type: 'folder', name: 'shared', children: [
        { type: 'file', name: 'brief.md', content: '# Video Brief\nWe want neon glass vibes.' }
      ] },
      { type: 'folder', name: 'assets', children: [
        { type: 'file', name: 'hero.jpg', contentType: 'image', src: 'https://picsum.photos/seed/hero/1200/700' }
      ] }
    ]
  }
};

const storeKey = 'brainstorm-data-v1';
const persisted = JSON.parse(localStorage.getItem(storeKey) || 'null');
let data = persisted || initialData;
let currentTab = 'local';
let openedPath = null;
let editorState = { dirty: false, path: null, content: null };

// -------------------- Utility: tree traversal --------------------
function pathToArray(path) {
  return path.split('/').filter(Boolean);
}
function getNode(root, path) {
  if (!path) return root;
  const parts = pathToArray(path);
  let cur = root;
  for (const part of parts) {
    if (!cur.children) return null;
    cur = cur.children.find(c => c.name === part);
    if (!cur) return null;
  }
  return cur;
}
function setNode(root, path, newNode) {
  const parts = pathToArray(path);
  if (!parts.length) return newNode;
  const last = parts.pop();
  const parent = getNode(root, parts.join('/'));
  if (!parent || !parent.children) return root;
  const idx = parent.children.findIndex(c => c.name === last);
  if (idx >= 0) parent.children[idx] = newNode;
  return root;
}
function listAllFiles(root, prefix = '') {
  let out = [];
  if (root.type === 'file') {
    out.push({ path: prefix, node: root });
  } else if (root.children) {
    for (const child of root.children) {
      out = out.concat(listAllFiles(child, prefix + '/' + child.name));
    }
  }
  return out;
}

// -------------------- Explorer rendering --------------------
const expanded = new Set(JSON.parse(localStorage.getItem('expanded') || '[]'));
function saveState() {
  localStorage.setItem(storeKey, JSON.stringify(data));
  localStorage.setItem('expanded', JSON.stringify([...expanded]));
}
function renderTree() {
  treeEl.innerHTML = '';
  const root = data[currentTab];
  const q = (searchEl.value || '').toLowerCase();
  const matches = q ? new Set(listAllFiles(root).filter(f => f.path.toLowerCase().includes(q)).map(f => f.path)) : null;

  function makeNode(node, path) {
    const item = document.createElement('div');
    item.className = 'node ' + node.type;
    item.dataset.path = path;

    const caret = document.createElement('div');
    caret.className = 'caret';
    caret.textContent = node.type === 'folder' ? (expanded.has(path) ? '▾' : '▸') : '•';
    item.appendChild(caret);

    const icon = document.createElement('div');
    icon.innerHTML = node.type === 'folder' ? '📁' : '📄';
    item.appendChild(icon);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = node.name;
    item.appendChild(label);

    if (openedPath === path) item.classList.add('active');

    item.addEventListener('click', e => {
      e.stopPropagation();
      if (node.type === 'folder') {
        if (expanded.has(path)) expanded.delete(path);
        else expanded.add(path);
        saveState();
        renderTree();
      } else {
        openFile(path);
      }
    });

    const wrapper = document.createElement('div');
    wrapper.appendChild(item);

    if (node.type === 'folder' && (expanded.has(path) || (matches && [...matches].some(p => p.startsWith(path + '/'))))) {
      const children = document.createElement('div');
      children.className = 'children';
      for (const child of (node.children || [])) {
        const childPath = path + '/' + child.name;
        if (matches && child.type === 'file' && !matches.has(childPath)) {
          // Skip non-matching files in search
          continue;
        }
        children.appendChild(makeNode(child, childPath));
      }
      wrapper.appendChild(children);
    }

    return wrapper;
  }

  const rootPath = '';
  const container = document.createElement('div');
  (root.children || []).forEach(child => {
    const childPath = '/' + child.name;
    container.appendChild(makeNode(child, childPath));
  });
  treeEl.appendChild(container);

  statusEl.textContent = `Showing ${currentTab} • ${listAllFiles(root).length} files`;
}
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  currentTab = t.dataset.tab;
  renderTree();
}));

searchEl.addEventListener('input', renderTree);

importBtn.addEventListener('click', () => importInput.click());
importInput.addEventListener('change', async (e) => {
  // Fake import: just add file names under /imports
  const files = [...e.target.files];
  if (!files.length) return;
  const root = data[currentTab];
  const importsFolderName = 'imports';
  let imports = root.children.find(c => c.type === 'folder' && c.name === importsFolderName);
  if (!imports) {
    imports = { type: 'folder', name: importsFolderName, children: [] };
    root.children.push(imports);
  }
  for (const f of files.slice(0, 20)) {
    imports.children.push({ type: 'file', name: f.name, content: `// Mock content of ${f.name}\n` });
  }
  statusEl.textContent = `Imported ${files.length} files`;
  saveState();
  renderTree();
});

newProjectBtn.addEventListener('click', () => {
  const name = prompt('Project name?', `project-${Math.floor(Math.random()*1000)}`);
  if (!name) return;
  const root = data[currentTab];
  root.children.push({ type: 'folder', name, children: [
    { type: 'file', name: 'README.md', content: `# ${name}\n\nWelcome to your new project.` },
    { type: 'folder', name: 'src', children: [] }
  ]});
  saveState();
  renderTree();
});

// -------------------- Preview / Editor --------------------
function openFile(path) {
  openedPath = path;
  $$('.tree .node').forEach(n => n.classList.toggle('active', n.dataset.path === path));
  crumbs.textContent = path;
  viewer.innerHTML = '';
  const node = getNode(data[currentTab], path.substring(1)); // remove leading slash
  if (!node) return;
  editorState = { dirty: false, path, content: node.content || '' };
  saveBtn.disabled = true;

  if (node.contentType === 'image' || /\.(png|jpg|jpeg|gif|webp)$/i.test(node.name)) {
    const img = document.createElement('img');
    img.src = node.src || URL.createObjectURL(new Blob()); // mock
    viewer.appendChild(img);
  } else if (/\.md$/i.test(node.name)) {
    viewer.appendChild(renderMarkdown(node.content || ''));
  } else if (/\.html$/i.test(node.name)) {
    const frame = document.createElement('iframe');
    frame.style = 'width:100%;height:60vh;border:1px solid rgba(120,200,190,.2);border-radius:10px;background:#fff';
    frame.srcdoc = node.content || '';
    viewer.appendChild(frame);
  } else {
    const pre = document.createElement('pre');
    pre.textContent = node.content || '';
    viewer.appendChild(pre);
  }
}
function renderMarkdown(md) {
  // Ultra-minimal markdown rendering
  const div = document.createElement('div');
  div.className = 'md';
  const html = md
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/gim, '<b>$1</b>')
    .replace(/\n- (.*?)/gim, '<li>$1</li>')
    .replace(/\n/g, '<br/>');
  div.innerHTML = html.replace(/<li>/g, '<ul><li>').replace(/<\/li>/g, '</li></ul>');
  return div;
}

editBtn.addEventListener('click', () => {
  const node = getNode(data[currentTab], (openedPath||'').substring(1));
  if (!node || node.type !== 'file') return;
  viewer.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.value = node.content || '';
  ta.style = 'width:100%;height:60vh;background:#0b1013;color:#cfe;border:1px solid rgba(120,200,190,.25);border-radius:12px;padding:12px;font-family: JetBrains Mono, ui-monospace, Menlo, Consolas, monospace';
  ta.addEventListener('input', () => {
    editorState.dirty = true;
    editorState.content = ta.value;
    saveBtn.disabled = false;
  });
  viewer.appendChild(ta);
});
saveBtn.addEventListener('click', () => {
  if (!editorState.dirty || !editorState.path) return;
  const p = editorState.path.substring(1);
  const node = getNode(data[currentTab], p);
  if (node && node.type === 'file') {
    node.content = editorState.content;
  }
  editorState.dirty = false;
  saveBtn.disabled = true;
  statusEl.textContent = 'Saved ' + editorState.path;
  saveState();
});

// -------------------- Chat --------------------
const fakeAI = {
  async respond(message, context) {
    const lower = message.trim().toLowerCase();
    // Slash commands
    if (lower.startsWith('/help')) {
      return { text: [
        'Available commands:',
        '• /summarize — summarize current preview or files',
        '• /todo — make a TODO from context',
        '• /search <term> — search files',
        '• /open <path> — open a file by path',
      ].join('\n') };
    }
    if (lower.startsWith('/open ')) {
      const path = message.slice(6).trim();
      const exists = !!getNode(data[currentTab], path.replace(/^\//, ''));
      if (exists) openFile(path.startsWith('/')? path: '/'+path);
      return { text: exists ? `Opened ${path}` : `Could not find ${path}` };
    }
    if (lower.startsWith('/search ')) {
      const q = message.slice(8).trim().toLowerCase();
      const files = listAllFiles(data[currentTab]).filter(f => f.path.toLowerCase().includes(q));
      return { text: files.length ? 'Found:\n' + files.map(f => '• ' + f.path).join('\n') : 'No results.' };
    }
    if (lower.startsWith('/summarize')) {
      const focus = openedPath || '(nothing open)';
      const node = openedPath ? getNode(data[currentTab], openedPath.substring(1)) : null;
      let summary = `Summary of ${focus}:\n`;
      if (node?.content) {
        const lines = node.content.split('\n').slice(0, 12);
        summary += lines.join('\n') + (node.content.split('\n').length > lines.length ? '\n…' : '');
      } else summary += 'no textual content';
      return { text: summary, tools: [{ name: 'file.peek', args: { path: openedPath } }] };
    }
    if (lower.startsWith('/todo')) {
      const project = data[currentTab].children?.[0]?.name || 'project';
      return { text: `TODO for ${project}:\n1) Wire real fs APIs\n2) Add auth for cloud\n3) Improve message formatting\n4) Write tests` };
    }

    // Default: chatty assistant with canned smarts
    const tips = [
      'Tip: you can drag files into the explorer to mock-import.',
      'Try /search index to locate index.html.',
      'Open README.md and use /summarize.',
      'Use the Edit/Save buttons in the preview panel for text files.',
    ];
    const fileHint = openedPath ? `I see you have ${openedPath} open.` : 'You have no file open yet.';
    return {
      text: `Okay! ${fileHint} ${tips[Math.floor(Math.random()*tips.length)]}`,
      tools: openedPath ? [{ name: 'context', args: { openedPath } }] : undefined
    };
  }
};

function addMessage(role, text, opts = {}) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + (role === 'you' ? 'you' : 'assistant');
  msg.innerHTML = `
    <div class="meta">${role === 'you' ? 'You' : 'Assistant'}</div>
    <div class="content"></div>
    ${opts.tools ? `<div class="tools">${opts.tools.map(t => `<span class="toolchip">🔧 ${t.name}${t.args ? ` <span class="tokens">${JSON.stringify(t.args)}</span>`:''}</span>`).join('')}</div>` : ''}
  `;
  $('.content', msg).textContent = text;
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return msg;
}

function streamAssistantText(text, tools) {
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  msg.innerHTML = `<div class="meta">Assistant</div><div class="content"></div>`;
  messagesEl.appendChild(msg);
  const contentEl = $('.content', msg);

  let i = 0;
  const words = text.split(' ');
  return new Promise(resolve => {
    const interval = setInterval(() => {
      contentEl.textContent += (i ? ' ' : '') + words[i];
      messagesEl.scrollTop = messagesEl.scrollHeight;
      i++;
      if (i >= words.length) {
        clearInterval(interval);
        if (tools?.length) {
          const toolDiv = document.createElement('div');
          toolDiv.className = 'tools';
          toolDiv.innerHTML = tools.map(t => `<span class="toolchip">🔧 ${t.name}${t.args ? ` <span class="tokens">${JSON.stringify(t.args)}</span>`:''}</span>`).join('');
          msg.appendChild(toolDiv);
        }
        resolve();
      }
    }, 40 + Math.random()*40);
  });
}

sendBtn.addEventListener('click', onSend);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); }
});
expandBtn.addEventListener('click', () => {
  const rows = inputEl.rows;
  inputEl.rows = rows >= 6 ? 1 : rows + 2;
});

function onSend() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage('you', text);
  inputEl.value = '';
  inputEl.rows = 1;

  setLoading(true);
  fakeAI.respond(text, { openedPath }).then(async res => {
    await streamAssistantText(res.text, res.tools);
  }).finally(() => setLoading(false));
}

function setLoading(is) {
  sendBtn.disabled = is;
  sendBtn.textContent = is ? '…' : '➤';
}

// ------------- Misc -------------
function boot() {
  renderTree();
  // Welcome messages
  if (!localStorage.getItem('welcomed')) {
    addMessage('assistant', 'Welcome to Brainstorm. Ask me to open files, summarize, or make TODOs. Try /help');
    localStorage.setItem('welcomed', '1');
  }
}
boot();

// Fake drop import
treeEl.addEventListener('dragover', e => { e.preventDefault(); treeEl.style.outline = '2px dashed rgba(140,220,210,.5)'; });
treeEl.addEventListener('dragleave', () => { treeEl.style.outline = 'none'; });
treeEl.addEventListener('drop', e => {
  e.preventDefault();
  treeEl.style.outline = 'none';
  // Cannot read files in pure browser reliably; just mock
  const root = data[currentTab];
  const dropped = { type: 'folder', name: 'dropped-' + Date.now().toString().slice(-5), children: [
    { type: 'file', name: 'dummy.txt', content: 'This came from a drop event (mock).' }
  ]};
  root.children.push(dropped);
  statusEl.textContent = 'Imported via drag-and-drop (mock)';
  saveState(); renderTree();
});

// Expose minimal for console testing
window.brainstorm = { data, renderTree, openFile };

// -------------------- Layout: Explorer collapse/reduce + floating preview drag --------------------
const panes = document.querySelector('.panes');
const btnHide = document.getElementById('btn-explorer-hide');
const btnReduce = document.getElementById('btn-explorer-reduce');

// Add persistent rail toggle so you can bring explorer back when hidden
const railTop = document.querySelector('.rail-top');
if (railTop && !document.getElementById('rail-explorer-toggle')) {

// Make preview draggable using its top bar as a handle (pointer events)
(function enablePreviewDrag(){
  const panel = document.getElementById('preview');
  const handle = panel?.querySelector('.preview-top');
  const ws = document.querySelector('.workspace');
  if (!panel || !handle || !ws) return;

  // Restore saved position
  const savedLeft = localStorage.getItem('prev-left');
  const savedTop = localStorage.getItem('prev-top');
  if (savedLeft) panel.style.setProperty('--prev-left', savedLeft);
  if (savedTop) panel.style.setProperty('--prev-top', savedTop);

  let dragging = false;
  let startX = 0, startY = 0;
  let startLeftPct = 50, startTopPx = 0;

  function currentMetrics() {
    const wsRect = ws.getBoundingClientRect();
    const pr = panel.getBoundingClientRect();
    const cx = (pr.left - wsRect.left) + pr.width/2;
    const cy = (pr.top - wsRect.top);
    return { wsRect, cx, cy };
  }

  function onPointerDown(e){
    e.preventDefault();
    handle.setPointerCapture?.(e.pointerId);
    dragging = true;
    panel.classList.add('dragging');
    startX = e.clientX; startY = e.clientY;
    const { wsRect, cx, cy } = currentMetrics();
    startLeftPct = (cx / wsRect.width) * 100;
    startTopPx = cy;
    document.body.style.userSelect = 'none';
  }
  function onPointerMove(e){
    if (!dragging) return;
    const { wsRect } = currentMetrics();
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const newLeftPct = Math.max(5, Math.min(95, startLeftPct + (dx / wsRect.width) * 100));
    const newTopPx = Math.max(80, Math.min(wsRect.height - 100, startTopPx + dy));
    panel.style.setProperty('--prev-left', newLeftPct + '%');
    panel.style.setProperty('--prev-top', newTopPx + 'px');
  }
  function onPointerUp(){
    if (!dragging) return;
    dragging = false;
    panel.classList.remove('dragging');
    document.body.style.userSelect = '';
    const csLeft = getComputedStyle(panel).getPropertyValue('--prev-left');
    const csTop = getComputedStyle(panel).getPropertyValue('--prev-top');
    localStorage.setItem('prev-left', csLeft.trim());
    localStorage.setItem('prev-top', csTop.trim());
  }

  handle.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
})();

  let zolarReady = false;
  const zolarQueue = [];
  let zolarOrigin = '*';
  try { if (zolarIframe?.src) zolarOrigin = new URL(zolarIframe.src).origin; } catch {}

  function flushZolarQueue() {
    if (!zolarIframe?.contentWindow) return;
    while (zolarQueue.length) {
      const { type, payload } = zolarQueue.shift();
      zolarIframe.contentWindow.postMessage({ type, payload }, zolarOrigin);
      console.log('[briiztorm->zolar:flush]', type, payload);
    }

  function sendToZolar(type, payload = {}) {
    if (!zolarIframe || !zolarIframe.contentWindow) {
      console.warn('Zolar iframe not available');
      return;
    }
    if (!zolarReady) {
      zolarQueue.push({ type, payload });
      try { zolarIframe.contentWindow.postMessage({ type: 'PING' }, zolarOrigin); } catch {}
