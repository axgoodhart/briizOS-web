

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Project Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Orbitron for that Sci-Fi/Vaporwave aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Rajdhani', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        /* Holographic HUD styling */
        .hologram-panel {
            background: rgba(10, 20, 30, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 20px rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            color: #e0faff;
            transform: perspective(1000px) rotateY(-5deg);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: auto;
        }

        .neon-text {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.7), 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        .neon-border-bottom {
            border-bottom: 1px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 1px 5px rgba(0, 255, 255, 0.3);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #00111a; }
        ::-webkit-scrollbar-thumb { background: #00cccc; border-radius: 3px; }

        .stat-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            width: 100%;
            border-radius: 2px;
            overflow: hidden;
        }
        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            box-shadow: 0 0 10px #00ffff;
        }

        /* Floating Animation for UI elements */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .floating { animation: float 4s ease-in-out infinite; }

        /* Input styling */
        .glass-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: white;
            font-family: 'Orbitron', sans-serif;
        }
        .glass-input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer" class="flex flex-col justify-between p-8">
        
        <!-- Header / Top Nav -->
        <div class="flex justify-between items-center pointer-events-auto">
            <div class="text-2xl md:text-4xl font-bold neon-text tracking-widest text-cyan-400 select-none opacity-80">
                CELESTIA // OS
            </div>
            <div class="text-xs md:text-sm font-mono text-cyan-200/50 tracking-widest">
                COORDINATES: <span id="coords-display">0, 0, 0</span>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="flex justify-between items-end pointer-events-auto w-full">
            <button onclick="openCreationModal()" class="group relative px-6 py-3 bg-black/40 border border-cyan-500/50 hover:border-cyan-400 hover:bg-cyan-900/20 transition-all duration-300 overflow-hidden">
                <div class="absolute inset-0 w-0 bg-cyan-500/10 transition-all duration-[250ms] ease-out group-hover:w-full"></div>
                <span class="relative neon-text text-cyan-300 text-sm tracking-widest group-hover:text-white">+ MANIFEST PROJECT</span>
            </button>

            <div class="text-right flex flex-col items-end gap-2">
                <button onclick="toggleDrive()" id="drive-btn" class="px-4 py-1 border border-cyan-500/30 text-xs text-cyan-400 hover:bg-cyan-500/20 transition-colors uppercase tracking-widest">
                    Engage Thrusters
                </button>
                <div>
                    <div class="text-xs text-cyan-600 font-mono uppercase">System Status</div>
                    <div id="system-status" class="text-cyan-400 neon-text text-sm">ONLINE // STATIONARY</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Project Details HUD (Hidden by default) -->
    <div id="project-hud" class="hidden absolute top-1/2 right-10 -translate-y-1/2 w-96 hologram-panel p-6 rounded-lg pointer-events-auto z-20">
        <div class="flex justify-between items-start mb-4 border-b border-cyan-500/30 pb-2">
            <div>
                <h2 id="hud-title" class="text-3xl neon-text text-white mb-1 tracking-wide">UNTITLED</h2>
                <p id="hud-subtitle" class="text-xs text-cyan-300 uppercase tracking-[0.2em]">Music Composition</p>
            </div>
            <button onclick="closeHUD()" class="text-cyan-500 hover:text-white transition-colors">✕</button>
        </div>

        <div class="space-y-6">
            <!-- Stats Section -->
            <div id="hud-stats-container" class="space-y-3">
                <!-- Stats injected via JS -->
            </div>

            <!-- Meta Info -->
            <div class="mt-6 pt-4 border-t border-cyan-500/20 flex justify-between text-xs font-mono text-gray-400">
                <span>LAST UPDATE: <span id="hud-date" class="text-cyan-400">JUST NOW</span></span>
                <span id="hud-shards" class="text-pink-400">0 SHARDS</span>
            </div>
        </div>
        
        <!-- Decorative curved line element like in screenshot -->
        <div class="absolute -left-12 top-20 w-12 h-32 border-l-2 border-b-2 border-cyan-500/40 rounded-bl-3xl pointer-events-none"></div>
    </div>

    <!-- Creation Modal -->
    <div id="creation-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="hologram-panel w-full max-w-md p-8 rounded-none border-2 border-cyan-500/50 transform-none">
            <h2 class="text-2xl neon-text text-center mb-6 text-cyan-300">INITIALIZE CHRYSALIS</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-cyan-500 mb-1 tracking-widest">PROJECT DESIGNATION</label>
                    <input type="text" id="new-project-name" class="w-full p-3 glass-input" placeholder="e.g. I SANG FOR SPRING">
                </div>
                
                <div>
                    <label class="block text-xs text-cyan-500 mb-1 tracking-widest">CATEGORY</label>
                    <select id="new-project-cat" class="w-full p-3 glass-input">
                        <option value="Composition">Composition</option>
                        <option value="Programming">Programming</option>
                        <option value="Writing">Writing</option>
                        <option value="Design">Design</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-cyan-500 mb-1 tracking-widest">CORE COLOR</label>
                    <div class="flex gap-2 mt-2">
                        <button onclick="selectColor('#00ffff')" class="w-8 h-8 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background:#00ffff"></button>
                        <button onclick="selectColor('#ff00ff')" class="w-8 h-8 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background:#ff00ff"></button>
                        <button onclick="selectColor('#ffff00')" class="w-8 h-8 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background:#ffff00"></button>
                        <button onclick="selectColor('#00ff00')" class="w-8 h-8 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background:#00ff00"></button>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex gap-4">
                <button onclick="closeCreationModal()" class="flex-1 py-3 border border-red-500/30 text-red-400 hover:bg-red-900/20 hover:text-white transition-colors tracking-widest text-xs">ABORT</button>
                <button onclick="submitNewProject()" class="flex-1 py-3 bg-cyan-900/40 border border-cyan-500 text-cyan-300 hover:bg-cyan-500 hover:text-black transition-colors tracking-widest text-xs font-bold neon-text">MATERIALIZE</button>
            </div>
        </div>
    </div>

    <!-- Three.js Imports -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

        // --- Global State ---
        let camera, scene, renderer;
        let grid, grid2; // Two grids for infinite illusion
        const projects = []; // Array to hold project objects
        let moveSpeed = 0; // Default to stationary
        let isHovering = false;
        let selectedColor = '#00ffff';
        
        // Raycaster for interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Dummy Data
        const initialProjects = [
            {
                name: "I SANG FOR SPRING",
                category: "Music Composition",
                color: 0x00ffff,
                stats: [
                    { label: "Lyrics", val: 9, max: 10 },
                    { label: "Composition", val: 4, max: 10 },
                    { label: "Concept", val: 8, max: 10 },
                    { label: "Notation", val: 3, max: 10 }
                ],
                pos: { x: 0, y: 2, z: -15 },
                shards: 5
            },
            {
                name: "NEURAL BRIDGE",
                category: "AI Development",
                color: 0xff00ff,
                stats: [
                    { label: "Training", val: 7, max: 10 },
                    { label: "Dataset", val: 2, max: 10 }
                ],
                pos: { x: -8, y: 1.5, z: -35 },
                shards: 3
            },
            {
                name: "VOID WALKER",
                category: "Game Design",
                color: 0xffff00,
                stats: [
                    { label: "Engine", val: 5, max: 10 },
                    { label: "Art", val: 6, max: 10 },
                    { label: "Sound", val: 9, max: 10 }
                ],
                pos: { x: 6, y: 3, z: -60 },
                shards: 8
            }
        ];

        init();
        animate();

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205); // Deep space dark blue/black
            // Teal fog with FogExp2
            scene.fog = new THREE.FogExp2(0x020205, 0.012);


            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 5); // Start slightly above ground

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.5;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // A point light attached to the camera (like a flashlight/miner's helm)
            const camLight = new THREE.PointLight(0xccffff, 1, 50);
            camera.add(camLight);
            scene.add(camera);

            // Environment
            createInfiniteGrid();
            createStars();

            // Create Initial Projects
            initialProjects.forEach(p => createChrysalis(p));

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);
            
            // Manual Movement Controls
            window.addEventListener('keydown', (e) => {
                if (e.key === 'w' || e.key === 'W') camera.position.z -= 0.5;
                if (e.key === 's' || e.key === 'S') camera.position.z += 0.5;
            });
        }

        // --- Environment Generation ---

        function createInfiniteGrid() {
            // We create two large grids that we leapfrog to simulate infinity
            const size = 200;
            const divisions = 100;
            
            // Grid 1
            grid = new THREE.GridHelper(size, divisions, 0x00ffff, 0x112244);
            grid.position.y = -1; // Slightly below y=0 so projects float
            scene.add(grid);

            // Grid 2 (starts ahead)
            grid2 = new THREE.GridHelper(size, divisions, 0x00ffff, 0x112244);
            grid2.position.y = -1;
            grid2.position.z = -size;
            scene.add(grid2);
            
            // Reflective Floor Plane (for that glass effect)
            const planeGeo = new THREE.PlaneGeometry(500, 500);
            const planeMat = new THREE.MeshPhysicalMaterial({
                color: 0x000000,
                metalness: 0.9,
                roughness: 0.1,
                reflectivity: 1,
                clearcoat: 1,
                clearcoatRoughness: 0.1,
            });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = -1.1; // Just below grid
            scene.add(plane);
        }

        function createStars() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 3000;
            const posArray = new Float32Array(starsCount * 3);
            
            for(let i = 0; i < starsCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 400; // Spread wide
            }
            
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            
            const starsMaterial = new THREE.PointsMaterial({
                size: 0.2,
                color: 0xffffff,
                transparent: true,
                opacity: 0.8,
                sizeAttenuation: true
            });
            
            const starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);
        }

        // --- Project Entity: The Chrysalis ---

        function createChrysalis(data) {
            const group = new THREE.Group();
            group.position.set(data.pos.x, data.pos.y, data.pos.z);
            
            // Store data in userDate for raycasting retrieval
            group.userData = { 
                isProject: true, 
                name: data.name,
                category: data.category,
                stats: data.stats,
                date: "11 WEEKS AGO",
                shardsCount: data.shards,
                baseColor: data.color
            };

            // 1. Core Crystal (Icosahedron)
            const geometry = new THREE.IcosahedronGeometry(1, 0);
            const material = new THREE.MeshPhysicalMaterial({
                color: data.color,
                metalness: 0.1,
                roughness: 0,
                transmission: 0.6, // Glass-like
                thickness: 2, // Volume
                envMapIntensity: 1,
                clearcoat: 1,
                emissive: data.color,
                emissiveIntensity: 0.2
            });
            const crystal = new THREE.Mesh(geometry, material);
            crystal.userData = group.userData; // Propagate data to mesh for click detection
            group.add(crystal);

            // 2. Inner Wireframe (Tech feel)
            const wireGeo = new THREE.WireframeGeometry(geometry);
            const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
            const wireframe = new THREE.LineSegments(wireGeo, wireMat);
            group.add(wireframe);

            // 3. Orbiting Shards (Moons)
            const shardCount = data.shards || 3;
            const shardGeo = new THREE.TetrahedronGeometry(0.2);
            
            for (let i = 0; i < shardCount; i++) {
                const shardMat = new THREE.MeshBasicMaterial({ color: data.color });
                const shard = new THREE.Mesh(shardGeo, shardMat);
                
                // Random orbit parameters
                const distance = 2 + Math.random() * 1.5;
                const speed = 0.01 + Math.random() * 0.02;
                const axis = new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize();
                
                // Attach update function to shard for animation loop
                shard.userData = {
                    orbit: { distance, speed, axis, angle: Math.random() * Math.PI * 2 }
                };
                
                group.add(shard);
                // We'll manually update positions in animate() via the group
                group.userData.shards = group.children.filter(c => c.userData.orbit);
            }

            // 4. Project Label (Canvas Texture)
            const labelCanvas = document.createElement('canvas');
            const ctx = labelCanvas.getContext('2d');
            labelCanvas.width = 512; 
            labelCanvas.height = 128;
            ctx.font = 'Bold 40px Orbitron';
            ctx.fillStyle = 'rgba(0,255,255,0.8)';
            ctx.textAlign = 'center';
            ctx.shadowColor = "cyan";
            ctx.shadowBlur = 10;
            ctx.fillText(data.name, 256, 80);

            const labelTex = new THREE.CanvasTexture(labelCanvas);
            const labelMat = new THREE.SpriteMaterial({ map: labelTex, transparent: true, opacity: 0.8 });
            const labelSprite = new THREE.Sprite(labelMat);
            labelSprite.position.y = 2.5;
            labelSprite.scale.set(4, 1, 1);
            group.add(labelSprite);

            scene.add(group);
            projects.push(group);
        }

        // --- Main Loop ---

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // 1. Glide Camera Forward
            camera.position.z -= moveSpeed;
            
            // Move point light with camera
            camera.children[0].position.copy(camera.position); 

            // 2. Infinite Grid Logic
            // If camera passes a grid segment, move that segment forward
            if (camera.position.z < grid.position.z - 100) {
                grid.position.z -= 400; // Leapfrog
            }
            if (camera.position.z < grid2.position.z - 100) {
                grid2.position.z -= 400;
            }

            // 3. Animate Projects
            projects.forEach(group => {
                // Rotate main crystal
                group.children[0].rotation.y += 0.005;
                group.children[0].rotation.z += 0.002;
                group.children[1].rotation.y -= 0.005; // Wireframe counter-rotate

                // Animate Shards
                if (group.userData.shards) {
                    group.userData.shards.forEach(shard => {
                        const orbit = shard.userData.orbit;
                        orbit.angle += orbit.speed;
                        
                        // Calculate new position based on orbit axis
                        // Simple circular orbit logic on XZ plane rotated by axis?
                        // Simplified: Just simple sin/cos on flat plane + axis offset
                        shard.position.x = Math.cos(orbit.angle) * orbit.distance;
                        shard.position.z = Math.sin(orbit.angle) * orbit.distance;
                        shard.position.y = Math.sin(orbit.angle * 2) * 0.5; // Bob up and down
                        
                        shard.rotation.x += 0.02;
                        shard.rotation.y += 0.02;
                    });
                }
                
                // Hover float effect for the whole group
                group.position.y = (group.userData.stats ? group.userData.stats.length : 2) * 0.2 + Math.sin(time + group.position.x) * 0.2;
            });

            // 4. Raycaster for Hover Cursor
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            let foundProject = false;
            if (intersects.length > 0) {
                // Traverse up to find the group or mesh with userData
                let obj = intersects[0].object;
                while(obj.parent && !obj.userData.isProject) {
                    obj = obj.parent;
                }
                
                if (obj.userData.isProject) {
                    foundProject = true;
                    document.body.style.cursor = 'pointer';
                }
            }
            
            if (!foundProject) {
                document.body.style.cursor = 'default';
            }

            // Update UI Coordinates
            const zPos = Math.abs(Math.floor(camera.position.z));
            document.getElementById('coords-display').innerText = `${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${zPos}`;

            renderer.render(scene, camera);
        }

        // --- Interaction Helpers ---

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            // Normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Subtle Camera Parallax (Steering)
            // We don't want to rotate fully, just lean
            const targetRotX = -mouse.y * 0.1;
            const targetRotY = -mouse.x * 0.1;
            
            // Smooth interpolation
            camera.rotation.x += (targetRotX - camera.rotation.x) * 0.05;
            camera.rotation.y += (targetRotY - camera.rotation.y) * 0.05;
            
            // Also drift X position slightly based on mouse
            camera.position.x += (mouse.x * 0.05);
        }

        function onClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                // Climb hierarchy to find the project root
                while(obj.parent && obj.userData && !obj.userData.isProject) {
                    obj = obj.parent;
                }

                if (obj.userData && obj.userData.isProject) {
                    openHUD(obj.userData);
                } else {
                    // Clicked space? maybe close HUD
                    // closeHUD(); 
                }
            }
        }

        // --- UI Integration Functions ---

        window.toggleDrive = function() {
            const btn = document.getElementById('drive-btn');
            const status = document.getElementById('system-status');
            
            if (moveSpeed === 0) {
                moveSpeed = 0.2;
                btn.innerText = "Disengage Thrusters";
                status.innerText = "ONLINE // GLIDING";
                btn.classList.add('bg-cyan-500/20', 'text-white');
            } else {
                moveSpeed = 0;
                btn.innerText = "Engage Thrusters";
                status.innerText = "ONLINE // STATIONARY";
                btn.classList.remove('bg-cyan-500/20', 'text-white');
            }
        }

        window.selectColor = function(color) {
            selectedColor = color;
            // Visual feedback could be added here
        }

        window.openHUD = function(data) {
            const hud = document.getElementById('project-hud');
            
            // Populate Data
            document.getElementById('hud-title').innerText = data.name;
            document.getElementById('hud-subtitle').innerText = data.category;
            document.getElementById('hud-date').innerText = data.date || "UNKNOWN";
            document.getElementById('hud-shards').innerText = (data.shardsCount || 0) + " SHARDS";
            
            const statsContainer = document.getElementById('hud-stats-container');
            statsContainer.innerHTML = '';

            if (data.stats && data.stats.length > 0) {
                data.stats.forEach(stat => {
                    const percentage = (stat.val / stat.max) * 100;
                    const html = `
                        <div>
                            <div class="flex justify-between text-xs font-bold tracking-wider mb-1">
                                <span class="text-cyan-100">${stat.label.toUpperCase()}</span>
                                <span class="text-cyan-400">${stat.val}/${stat.max}</span>
                            </div>
                            <div class="stat-bar-bg">
                                <div class="stat-bar-fill" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                    `;
                    statsContainer.innerHTML += html;
                });
            } else {
                statsContainer.innerHTML = '<div class="text-xs text-gray-500 italic">NO METRICS AVAILABLE</div>';
            }

            hud.classList.remove('hidden');
        }

        window.closeHUD = function() {
            document.getElementById('project-hud').classList.add('hidden');
        }

        window.openCreationModal = function() {
            document.getElementById('creation-modal').classList.remove('hidden');
            document.getElementById('creation-modal').classList.add('flex');
            moveSpeed = 0; // Pause movement
        }

        window.closeCreationModal = function() {
            document.getElementById('creation-modal').classList.add('hidden');
            document.getElementById('creation-modal').classList.remove('flex');
            moveSpeed = 0.2; // Resume
        }

        window.submitNewProject = function() {
            const name = document.getElementById('new-project-name').value || "UNTITLED PROJECT";
            const cat = document.getElementById('new-project-cat').value;
            
            // Create new data object
            const newProj = {
                name: name,
                category: cat,
                color: parseInt(selectedColor.replace('#', '0x')),
                stats: [
                    { label: "Concept", val: 1, max: 10 },
                    { label: "Execution", val: 0, max: 10 }
                ],
                // Spawn it just in front of the camera so we see it fly by
                pos: { 
                    x: (Math.random() - 0.5) * 10 + camera.position.x, 
                    y: 2, 
                    z: camera.position.z - 30 
                },
                shards: 1
            };
